name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_OUTPUT_FORMAT: github
  TY_OUTPUT_FORMAT: github

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify affected checks
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          sh .github/scripts/classify-changes.sh --self-test
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            sh .github/scripts/classify-changes.sh --all >> "$GITHUB_OUTPUT"
          elif [[ -z "$BASE_SHA" ]] ||
            [[ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]]
          then
            sh .github/scripts/classify-changes.sh --all >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA...$GITHUB_SHA" |
              sh .github/scripts/classify-changes.sh >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint and static analysis
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --locked
      - run: uv run --locked pre-commit run --all-files
      - name: Validate benchmark workloads
        run: >-
          uv run --locked python -c
          "from benchmarks.compare_h2 import check_workloads; check_workloads()"

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv run --locked --no-dev --group docs zensical build --strict

  python:
    name: Python ${{ matrix.python-version }}${{ matrix.preview && ' preview' || '' }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        include:
          # Pre-release interpreters exercise forward compatibility but are
          # not wheel targets until CPython reaches the release candidate phase.
          - os: ubuntu-latest
            python-version: "3.15"
            preview: true
          - os: ubuntu-latest
            python-version: "3.15t"
            preview: true
          - os: ubuntu-24.04-arm
            python-version: "3.12"
          - os: macos-15-intel
            python-version: "3.12"
          - os: macos-14
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-11-arm
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-dev --group test
      - run: uv run --locked --no-dev --group test pytest -m "not h2spec"

  h2spec:
    name: h2spec generic conformance
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --locked --no-dev --group test
      - name: Install h2spec 2.6.0
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/h2spec.tar.gz" \
            https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          echo "157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318  $RUNNER_TEMP/h2spec.tar.gz" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/h2spec"
          tar -xzf "$RUNNER_TEMP/h2spec.tar.gz" -C "$RUNNER_TEMP/h2spec"
          echo "$RUNNER_TEMP/h2spec" >> "$GITHUB_PATH"
      - run: uv run --locked --no-dev --group test pytest -m h2spec

  package:
    name: Source distribution
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Build sdist and rebuild its wheel
        run: |
          uv build --sdist
          uv build --wheel dist/*.tar.gz
      - name: Test the installed wheel outside the source tree
        run: |
          uv venv "$RUNNER_TEMP/ngh2-wheel-test"
          uv pip install --python "$RUNNER_TEMP/ngh2-wheel-test/bin/python" \
            dist/*.whl --group "$GITHUB_WORKSPACE/pyproject.toml:test"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ngh2-wheel-test/bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests" -m "not h2spec"

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Codecov uses OIDC, so no long-lived upload token is stored.
    permissions:
      contents: read
      id-token: write
    env:
      CMAKE_ARGS: -DNGH2_COVERAGE=ON
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Build the traced extension
        run: >-
          uv --no-cache sync --locked --no-dev --group test --group coverage
          --reinstall-package ngh2
      - name: Expose generated C sources to the Cython coverage plugin
        run: |
          ln -s "$(find "$GITHUB_WORKSPACE/build" -name _core.c -print -quit)" src/ngh2/_core.c
          ln -s "$(find "$GITHUB_WORKSPACE/build" -name events.c -print -quit)" src/ngh2/events.c
      - run: uv run --no-sync coverage run -m pytest -m "not h2spec"
      - run: uv run --no-sync coverage xml
      - run: uv run --no-sync coverage report
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          disable_search: true
          # Test and report generation already gate this job; an external
          # upload outage should not block the project CI.
          fail_ci_if_error: false
          files: coverage.xml
          use_oidc: true

  required:
    name: Required checks
    if: always()
    needs:
      - changes
      - lint
      - docs
      - python
      - h2spec
      - package
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful affected checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
