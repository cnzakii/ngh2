name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_OUTPUT_FORMAT: github
  TY_OUTPUT_FORMAT: github

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      docs: ${{ steps.paths.outputs.docs }}
      python: ${{ steps.python.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify affected checks
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          sh .github/scripts/classify-changes.sh --self-test
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            sh .github/scripts/classify-changes.sh --all >> "$GITHUB_OUTPUT"
          elif [[ -z "$BASE_SHA" ]] ||
            [[ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]]
          then
            sh .github/scripts/classify-changes.sh --all >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA...$GITHUB_SHA" |
              sh .github/scripts/classify-changes.sh >> "$GITHUB_OUTPUT"
          fi
      # .python-version is the single source of the development interpreter.
      - name: Read the development Python version
        id: python
        run: |
          version="$(cat .python-version)"
          grep -Eq '^3\.[0-9]+$' <<< "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and static analysis
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run --locked pre-commit run --all-files
      - name: Keep Read the Docs on the development Python version
        run: |
          grep -Fqx "    python: \"$(cat .python-version)\"" .readthedocs.yaml
      - name: Validate benchmark workloads
        run: >-
          uv run --locked python -c
          "from benchmarks.compare_h2 import check_workloads; check_workloads()"

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --locked --no-dev --group docs python docs/griffe_runtime_docstrings.py
      - run: uv run --locked --no-dev --group docs zensical build --strict

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
        include:
          - os: ubuntu-24.04-arm
            python-version: ${{ needs.changes.outputs.python }}
          - os: macos-26-intel
            python-version: ${{ needs.changes.outputs.python }}
          - os: macos-26
            python-version: ${{ needs.changes.outputs.python }}
          - os: windows-2025
            python-version: ${{ needs.changes.outputs.python }}
          - os: windows-11-arm
            python-version: ${{ needs.changes.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-dev --group test
      - run: uv run --locked --no-dev --group test pytest -m "not h2spec"

  python-musl:
    name: Python ${{ needs.changes.outputs.python }} on musllinux ${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      # The runner cannot execute JavaScript actions inside Alpine containers
      # on arm64, so the tests run through docker run instead of a job
      # container.
      - name: Test in Alpine
        env:
          PYTHON_VERSION: ${{ needs.changes.outputs.python }}
        run: |
          docker run --rm --volume "$PWD:/work" --workdir /work \
            --env UV_PYTHON_DOWNLOADS=never \
            "ghcr.io/astral-sh/uv:python${PYTHON_VERSION}-alpine" sh -euxc '
              apk add --no-cache build-base cmake
              uv sync --locked --no-dev --group test
              uv run --locked --no-dev --group test pytest -m "not h2spec"
            '

  sanitizers:
    name: AddressSanitizer and UBSan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Instrument the binding and libnghttp2; the test step preloads the runtimes.
      CFLAGS: >-
        -fsanitize=address,undefined -fno-sanitize-recover=undefined
        -fno-omit-frame-pointer -g -O1
      LDFLAGS: -fsanitize=address,undefined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build the instrumented extension
        run: >-
          uv --no-cache sync --locked --no-dev --group test
          --reinstall-package ngh2 --config-setting install.strip=false
      - name: Run tests under the sanitizers
        env:
          # CPython leaks at exit by design; pymalloc would hide object overruns.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
          PYTHONMALLOC: malloc
        # sys capture leaves fd 2 alone, so a report survives the abort.
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libubsan.so)" \
            .venv/bin/python -m pytest -m "not h2spec" --capture=sys

  h2spec:
    name: h2spec generic conformance
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --no-dev --group test
      - name: Install h2spec 2.6.0
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/h2spec.tar.gz" \
            https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          echo "157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318  $RUNNER_TEMP/h2spec.tar.gz" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/h2spec"
          tar -xzf "$RUNNER_TEMP/h2spec.tar.gz" -C "$RUNNER_TEMP/h2spec"
          echo "$RUNNER_TEMP/h2spec" >> "$GITHUB_PATH"
      - run: uv run --locked --no-dev --group test pytest -m h2spec

  package:
    name: Source distribution
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build sdist and rebuild its wheel
        run: |
          uv build --sdist
          uv build --wheel dist/*.tar.gz
      - name: Test the installed wheel outside the source tree
        run: |
          uv venv "$RUNNER_TEMP/ngh2-wheel-test"
          uv pip install --python "$RUNNER_TEMP/ngh2-wheel-test/bin/python" \
            dist/*.whl --group "$GITHUB_WORKSPACE/pyproject.toml:test"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ngh2-wheel-test/bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests" -m "not h2spec"

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Codecov uses OIDC, so no long-lived upload token is stored.
    permissions:
      contents: read
      id-token: write
    env:
      CMAKE_ARGS: -DNGH2_COVERAGE=ON
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build the traced extension
        run: >-
          uv --no-cache sync --locked --no-dev --group test --group coverage
          --reinstall-package ngh2
      - name: Expose generated C sources to the Cython coverage plugin
        run: |
          ln -s "$(find "$GITHUB_WORKSPACE/build" -name _core.c -print -quit)" src/ngh2/_core.c
          ln -s "$(find "$GITHUB_WORKSPACE/build" -name events.c -print -quit)" src/ngh2/events.c
      - run: uv run --no-sync coverage run -m pytest -m "not h2spec"
      - run: uv run --no-sync coverage xml
      - name: Verify Cython modules are measured
        run: |
          uv run --no-sync python - <<'PY'
          from xml.etree import ElementTree

          classes = ElementTree.parse("coverage.xml").findall(".//class")
          for module in ("_core.pyx", "events.pyx"):
              lines = [
                  line
                  for cls in classes
                  if cls.attrib["filename"].endswith("/" + module)
                  for line in cls.findall("lines/line")
              ]
              assert lines, f"{module} is absent from the coverage report"
              assert any(int(line.attrib["hits"]) for line in lines), (
                  f"{module} has no measured execution"
              )
          PY
      - run: uv run --no-sync coverage report
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          disable_search: true
          # Test and report generation already gate this job; an external
          # upload outage should not block the project CI.
          fail_ci_if_error: false
          files: coverage.xml
          use_oidc: true

  required:
    name: Required checks
    if: always()
    needs:
      - changes
      - lint
      - docs
      - python
      - python-musl
      - sanitizers
      - h2spec
      - package
      - coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful affected checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
