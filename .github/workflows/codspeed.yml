name: CodSpeed

# Runs on every main push so pull requests always have a baseline to compare.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # CodSpeed uses OIDC, so no long-lived upload token is stored.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      # CodSpeed's tracing needs the setup-python interpreter, not a uv-managed one.
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --no-dev --group test --group benchmark
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
      - uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          run: uv run --no-sync pytest benchmarks/test_codspeed.py --codspeed
