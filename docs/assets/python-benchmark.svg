<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
<title id="title">ngh2 and h2 time per iteration</title>
<desc id="desc">1 request · no body: ngh2 2.60 µs, h2 4.4.1 65.61 µs, 25.2 times faster; 10 concurrent requests · no body: ngh2 16.94 µs, h2 4.4.1 499.58 µs, 29.5 times faster; 10 concurrent · 10 MiB download each · max window: ngh2 17.58 ms, h2 4.4.1 126.11 ms, 7.2 times faster.</desc>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.card{fill:#ffffff;stroke:#d1d9e0}.rule{stroke:#eff2f5}.primary{fill:#1f2328}.secondary{fill:#59636e}.candidate{fill:#4b8bbe}.reference{fill:#d1d9e0}.badge{fill:#4b8bbe;fill-opacity:0.14}.badge-text{fill:#306998}
@media (prefers-color-scheme:dark){.card{fill:#0d1117;stroke:#3d444d}.rule{stroke:#262c36}.primary{fill:#f0f6fc}.secondary{fill:#9198a1}.reference{fill:#3d444d}.badge{fill-opacity:0.22}.badge-text{fill:#8ab4df}}
</style>
<rect class="card" x="0.5" y="0.5" width="759" height="309" rx="12"/>
<text class="primary" x="24" y="40" font-size="14" font-weight="600">1 request · no body</text>
<rect class="badge" x="632" y="24" width="104" height="22" rx="11"/>
<text class="badge-text" x="684.0" y="39" text-anchor="middle" font-size="12" font-weight="700">25.2× faster</text>
<text class="secondary" x="24" y="68" font-size="12" font-weight="500">ngh2</text>
<rect class="candidate" x="96" y="58" width="21.5" height="12" rx="6.0"/>
<text class="primary" x="125.5" y="68" font-size="12" font-weight="500">2.60 µs</text>
<text class="secondary" x="24" y="88" font-size="12" font-weight="500">h2 4.4.1</text>
<rect class="reference" x="96" y="78" width="544.0" height="12" rx="6.0"/>
<text class="primary" x="648.0" y="88" font-size="12" font-weight="500">65.61 µs</text>
<line class="rule" x1="24" y1="106" x2="736" y2="106"/>
<text class="primary" x="24" y="138" font-size="14" font-weight="600">10 concurrent requests · no body</text>
<rect class="badge" x="632" y="122" width="104" height="22" rx="11"/>
<text class="badge-text" x="684.0" y="137" text-anchor="middle" font-size="12" font-weight="700">29.5× faster</text>
<text class="secondary" x="24" y="166" font-size="12" font-weight="500">ngh2</text>
<rect class="candidate" x="96" y="156" width="18.4" height="12" rx="6.0"/>
<text class="primary" x="122.4" y="166" font-size="12" font-weight="500">16.94 µs</text>
<text class="secondary" x="24" y="186" font-size="12" font-weight="500">h2 4.4.1</text>
<rect class="reference" x="96" y="176" width="544.0" height="12" rx="6.0"/>
<text class="primary" x="648.0" y="186" font-size="12" font-weight="500">499.58 µs</text>
<line class="rule" x1="24" y1="204" x2="736" y2="204"/>
<text class="primary" x="24" y="236" font-size="14" font-weight="600">10 concurrent · 10 MiB download each · max window</text>
<rect class="badge" x="632" y="220" width="104" height="22" rx="11"/>
<text class="badge-text" x="684.0" y="235" text-anchor="middle" font-size="12" font-weight="700">7.2× faster</text>
<text class="secondary" x="24" y="264" font-size="12" font-weight="500">ngh2</text>
<rect class="candidate" x="96" y="254" width="75.9" height="12" rx="6.0"/>
<text class="primary" x="179.9" y="264" font-size="12" font-weight="500">17.58 ms</text>
<text class="secondary" x="24" y="284" font-size="12" font-weight="500">h2 4.4.1</text>
<rect class="reference" x="96" y="274" width="544.0" height="12" rx="6.0"/>
<text class="primary" x="648.0" y="284" font-size="12" font-weight="500">126.11 ms</text>
</svg>
