[project]
site_name = "ngh2"
site_description = "A fast Sans-I/O HTTP/2 library for Python."
site_author = "ngh2 contributors"
site_url = "https://cnzakii.github.io/ngh2/"
copyright = "Copyright &copy; 2026 ngh2 contributors"
docs_dir = "docs/site"
site_dir = "site"
repo_url = "https://github.com/cnzakii/ngh2"
repo_name = "cnzakii/ngh2"
extra_css = ["stylesheets/extra.css"]

nav = [
    { "Overview" = "index.md" },
    { "Learn ngh2" = [
        { "First HTTP/2 exchange" = "learn/first-exchange.md" },
        { "Protocol model" = "learn/protocol-model.md" },
        { "Multiplex two streams" = "learn/multiplexing.md" },
        { "HTTP message lifecycle" = "learn/message-lifecycle.md" },
    ] },
    { "Integrate ngh2" = [
        { "Drive an asyncio transport" = "guides/transport.md" },
        { "Serve with asyncio" = "guides/server.md" },
        { "Flow control and backpressure" = "guides/flow-control.md" },
        { "Events and actions" = "guides/events.md" },
        { "Errors and shutdown" = "guides/errors-and-shutdown.md" },
    ] },
    { "Advanced HTTP/2" = [
        { "Overview" = "advanced.md" },
        { "SETTINGS, PING, and state" = "advanced/settings-and-ping.md" },
        { "Server push" = "advanced/server-push.md" },
        { "RFC 9218 priorities" = "advanced/priorities.md" },
        { "h2c and extended CONNECT" = "advanced/h2c-and-connect.md" },
        { "ALTSVC and ORIGIN" = "advanced/alternative-services.md" },
    ] },
    { "Python API" = "reference.md" },
    { "Project" = [
        { "Changelog" = "changelog.md" },
        { "Security" = "security.md" },
        { "Contributing" = "contributing.md" },
        { "License" = "license.md" },
    ] },
]

[project.extra.version]
provider = "mike"
default = "latest"
alias = true

[project.theme]
variant = "modern"
language = "en"
logo = "assets/ngh2.svg"
favicon = "assets/ngh2.svg"
custom_dir = "docs/overrides"
features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
base_path = [
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "docs/assets/python-benchmark.md",
    "examples/python/first_round_trip.py",
    "examples/python/multiplexed_round_trip.py",
    "examples/python/message_lifecycle.py",
    "examples/python/asyncio_client.py",
    "examples/python/asyncio_server.py",
    "examples/python/manual_flow_control.py",
    "examples/python/graceful_shutdown.py",
    "examples/python/connection_controls.py",
    "examples/python/server_push.py",
    "examples/python/priorities.py",
    "examples/python/h2c_and_connect.py",
    "examples/python/alternative_services.py",
]
check_paths = true

[project.markdown_extensions.pymdownx.superfences]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
allow_inspection = true
docstring_style = "google"
extensions = ["docs/griffe_runtime_docstrings.py:RuntimeDocstrings"]
filters = ["!^_"]
members = true
members_order = "source"
separate_signature = true
show_signature_annotations = true
show_root_full_path = false
show_root_heading = true
show_labels = false
show_source = false
